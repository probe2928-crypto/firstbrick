<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>First Brick reel</title>
<!-- 1080×1920 결정적 모션: window.seek(t)로 프레임을 그린다. 문구·장면은 reel.js(window.REEL = reel.json 내용)에서 읽는다. -->
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..500&family=Jost:wght@300..500&family=Noto+Sans+KR:wght@400;500&family=Nanum+Myeongjo:wght@400;700&display=block" rel="stylesheet">
<style>
/* 메종 톤: 아이보리 · 먹 · 밤의 남색 · 금색은 첫 벽돌 하나에만 */
:root { --paper:#F5F1EA; --ink:#141414; --muted:#6D665C; --line:#8F877B; --rule:#D9D1C3; --blue:#1B2440; --mari:#B8862D; }
html,body { margin:0; width:1080px; height:1920px; overflow:hidden; background:var(--paper); }
#stage { position:relative; width:1080px; height:1920px; overflow:hidden; font-family:Jost,"Noto Sans KR",sans-serif; color:var(--ink); }
.layer { position:absolute; inset:0; }
.brand { position:absolute; left:0; right:0; top:132px; text-align:center; }
.brand b { display:block; font:600 46px/1 "Bodoni Moda",serif; font-variation-settings:"opsz" 18; letter-spacing:.3em; margin-right:-.3em; }
.brand small { display:block; margin-top:16px; font:400 17px/1 Jost; letter-spacing:.5em; margin-right:-.5em; color:var(--muted); }
.brand::after { content:""; display:block; width:60px; margin:34px auto 0; border-top:1.5px solid var(--rule); }
.h { position:absolute; left:80px; right:80px; text-align:center; font:500 120px/1.04 "Bodoni Moda",serif; letter-spacing:-.005em; font-variation-settings:"opsz" 24; }
.h.it { font-style:italic; }
.p { position:absolute; left:120px; right:120px; text-align:center; font:400 42px/1.55 Jost,sans-serif; color:var(--muted); }
.lang-ko .h { font-family:"Nanum Myeongjo",serif; letter-spacing:-.03em; line-height:1.3; }
.lang-ko .h.it { font-style:normal; }
.lang-ko .p { font-family:"Noto Sans KR"; }
.step { position:absolute; left:120px; right:120px; text-align:center; }
.step .course { display:flex; gap:10px; margin:0 auto 14px; width:440px; }
.step .course i { height:24px; flex:1; box-sizing:border-box; border:1.5px solid var(--line); }
.step h3 { margin:26px 0 12px; font:500 80px/1 "Bodoni Moda","Nanum Myeongjo",serif; font-variation-settings:"opsz" 24; }
.step p { margin:0 auto; font:400 36px/1.5 Jost,"Noto Sans KR",sans-serif; color:var(--muted); max-width:780px; }
.end { position:absolute; inset:0; background:var(--blue); color:var(--paper); }
.end .h { color:var(--paper); }
.end .p { color:#C3C7D3; }
.end .brand small { color:#9EA4B5; }
.end .brand::after { border-color:#3A4562; }
.url { position:absolute; left:0; right:0; top:1250px; text-align:center; font:500 30px/1 Jost; letter-spacing:.16em; color:var(--paper); }
.url span { border-bottom:2px solid var(--mari); padding-bottom:14px; }
.foot { position:absolute; left:96px; right:96px; top:1400px; text-align:center; font:400 26px/1.4 Jost,"Noto Sans KR"; letter-spacing:.04em; color:var(--muted); }
.end .foot { color:#9EA4B5; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="reel.js"></script>
<script>
(async function () {
  const C = window.REEL || await fetch("reel.json").then(r => r.json());
  window.DUR = C.dur || 15;
  const stage = document.getElementById("stage");
  if (C.lang === "ko") stage.classList.add("lang-ko");
  const ease = (x) => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3);
  const win = (t, a, b) => ease((t - a) / (b - a));
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const mark = '<b>FIRST BRICK</b><small>FOUNDATION</small>';

  // 학교 입면도 (사이트 히어로와 같은 그림: 가는 선, 첫 벽돌만 금잔화색)
  function houseSVG() {
    const G = 338, bx0 = 64, bx1 = 416, by0 = 176; let k = 0; const P = [];
    const L = (d, cls) => P.push(`<path class="${cls || "ln"}" pathLength="1" data-d="${k++}" d="${d}"/>`);
    L(`M8 ${G}H472`, "ln ground"); L(`M${bx0} ${G}V${by0}H${bx1}V${G}`); L(`M44 ${by0 + 2}L240 74L436 ${by0 + 2}`); L(`M62 ${by0 - 6}L240 90L418 ${by0 - 6}`, "ln thin");
    P.push(`<circle class="ln" pathLength="1" data-d="${k++}" cx="240" cy="136" r="15"/>`); L(`M225 136H255M240 121V151`, "ln thin");
    for (const x of [98, 304]) { L(`M${x} 214h78v58h-78z`); L(`M${x + 26} 214v58M${x + 52} 214v58M${x} 243h78`, "ln thin"); L(`M${x - 6} 278h90`, "ln thin"); }
    L(`M212 ${G}V250a28 28 0 0 1 56 0V${G}`); L(`M240 222V${G}`, "ln thin"); L(`M200 ${G - 0.5}h80`, "ln thin");
    const bw = 22, bh = 9, g = 2.5, H = [];
    for (let r = 0; r < 4; r++) { const off = r % 2 ? (bw + g) / 2 : 0, n = 5 - (r === 3 ? 2 : r === 2 ? 1 : 0);
      for (let c = 0; c < n; c++) { if (!r && !c) continue; const x = bx0 + 4 + off + c * (bw + g), y = G - 4 - (r + 1) * (bh + g) + g;
        H.push(`<rect class="hatch" data-d="${r * 5 + c}" data-o="${(1 - (r * 0.18 + c * 0.13)).toFixed(2)}" x="${x}" y="${y}" width="${bw}" height="${bh}"/>`); } }
    const fx = bx0 + 4, fy = G - 4 - bh;
    const wrap = document.createElement("div");
    wrap.innerHTML = `<svg viewBox="0 0 480 400" style="width:100%;overflow:visible"><style>.ln{fill:none;stroke:#141414;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1}.ln.thin{stroke-width:.75;stroke:#8F877B}.ln.ground{stroke-width:1.2}.hatch{fill:none;stroke:#A79E90;stroke-width:.75}.dim{fill:none;stroke:#BDB4A5;stroke-width:.75}.co path{fill:none;stroke:#141414;stroke-width:.75}.co text{font:italic 400 17px "Bodoni Moda",serif;fill:#141414}</style>${P.join("")}${H.join("")}<rect class="first" x="${fx}" y="${fy}" width="${bw}" height="${bh}" fill="#B8862D"/><path class="dim" d="M${bx0} ${G + 26}H${bx1}M${bx0} ${G + 20}v12M${bx1} ${G + 20}v12"/><g class="co"><path d="M${fx + bw / 2} ${fy + bh + 3}V${G + 52}H${fx + 150}"/><text x="${fx + 156}" y="${G + 56}">${C.lang === "ko" ? "첫 벽돌" : "The first brick"}</text></g></svg>`;
    const svg = wrap.firstChild;
    return { svg, lines: [...svg.querySelectorAll(".ln")], hatch: [...svg.querySelectorAll(".hatch")], first: svg.querySelector(".first"), late: [...svg.querySelectorAll(".dim, .co")] };
  }

  // 장면 만들기
  const scenes = (C.scenes || []).map((s) => {
    const L = el("div", "layer"); L.style.opacity = 0; stage.appendChild(L); s.L = L;
    if (s.type === "house") {
      const hs = houseSVG(); s.hs = hs; const wrap = el("div"); wrap.style.cssText = "position:absolute;left:110px;right:110px;top:930px;"; wrap.appendChild(hs.svg); hs.svg.style.width = "100%"; L.appendChild(wrap);
      s.lines = (s.lines || []).map((txt, i, arr) => { const h = el("div", "h" + (i === arr.length - 1 && arr.length > 1 ? " it" : ""), txt); h.style.cssText += `top:${380 + i * 136}px;font-size:${s.size || 124}px;`; L.appendChild(h); return h; });
      const cap = el("div", "p", s.caption || ""); cap.style.cssText += "top:1690px;font:italic 400 38px/1.4 'Bodoni Moda',serif;"; L.appendChild(cap); s.cap = cap;
    } else if (s.type === "steps") {
      const head = el("div", "h", s.title || ""); head.style.cssText += "top:350px;font-size:96px;"; L.appendChild(head); s.head = head;
      s.items = s.items.map((it, i) => { const d = el("div", "step"); d.style.top = (620 + i * 410) + "px";
        const tone = ["var(--b1)", "var(--b2)", "var(--b3)"];
        let courses = ""; for (let c = 0; c <= i; c++) courses += `<div class="course" style="transform:translateX(${c % 2 ? 22 : 0}px)">${[0, 1, 2, 3].map((k) => `<i style="${i === 0 && c === 0 && k === 0 ? "background:var(--mari);border-color:var(--mari)" : ""}"></i>`).join("")}</div>`;
        d.innerHTML = `<div style="display:flex;flex-direction:column-reverse">${courses}</div><h3>${it[0]}</h3><p>${it[1]}</p>`; L.appendChild(d); return d; });
    } else if (s.type === "lines") {
      const t = el("div", "h", s.title); t.style.cssText += `top:${(s.top || 420) + 40}px;font-size:${s.size || 112}px;`; L.appendChild(t);
      const body = el("div", "p"); body.style.cssText += `top:${(s.bodyTop || 800) + 40}px;color:var(--ink);`;
      s.parts = [t, ...(s.body || []).map((txt) => { const p = el("div", "", txt); p.style.marginBottom = "22px"; body.appendChild(p); return p; })];
      L.appendChild(body);
      if (s.wall) { const w = el("div"); w.style.cssText = "position:absolute;left:230px;right:230px;top:1330px;display:flex;flex-direction:column-reverse;gap:10px;"; const tone = ["var(--b1)", "var(--b2)", "var(--b3)", "var(--b2)", "var(--b1)"];
        s.courses = []; for (let c = 0; c < s.wall; c++) { const row = el("div"); row.style.cssText = `display:flex;gap:10px;margin-left:${c % 2 ? 36 : 0}px;margin-right:${c % 2 ? 0 : 36}px;`; row.innerHTML = [0, 1, 2, 3, 4].map((k) => `<i style="display:block;flex:1;height:30px;box-sizing:border-box;border:1.5px solid ${c === 0 && k === 0 ? "var(--mari)" : "var(--line)"};background:${c === 0 && k === 0 ? "var(--mari)" : "transparent"}"></i>`).join(""); w.appendChild(row); s.courses.push(row); }
        L.appendChild(w); }
    } else if (s.type === "end") {
      L.classList.add("end");
      L.innerHTML = `<div class="brand">${mark}</div>`;
      s.parts = [el("div", "h", s.title), el("div", "p", s.text || ""), el("div", "url", `<span>${s.url || ""}</span>`)];
      s.parts[0].style.cssText += "top:560px;font-size:118px;"; s.parts[1].style.cssText += "top:960px;";
      s.parts.forEach((p) => L.appendChild(p));
      const f = el("div", "foot", s.foot || ""); L.appendChild(f); s.foot = f;
    }
    if (s.brand !== false && s.type !== "end") { const b = el("div", "brand", mark); L.appendChild(b); }
    if (s.note) { const f = el("div", "foot", s.note); L.appendChild(f); }
    return s;
  });

  window.seek = function (t) {
    for (const s of scenes) {
      const a = s.t0, b = s.t1, fade = 0.35;
      const vis = t >= a - 0.001 && t < b + 0.001 ? Math.min(win(t, a, a + fade), s.last ? 1 : 1 - win(t, b - fade, b)) : 0;
      s.L.style.opacity = vis;
      const lt = t - a, len = b - a;
      if (s.type === "house") {
        s.hs.lines.forEach((el) => { const d = +el.dataset.d, k = win(lt, 0.1 + d * 0.07, 1.1 + d * 0.07); el.style.strokeDashoffset = (1 - k).toFixed(3); });
        s.hs.hatch.forEach((el) => { const d = +el.dataset.d; el.style.opacity = (+el.dataset.o * win(lt, 1.6 + d * 0.03, 2.0 + d * 0.03)).toFixed(3); });
        const kf = win(lt, 2.3, 2.8); s.hs.first.style.opacity = kf; s.hs.first.setAttribute("transform", `translate(0 ${(-18 * (1 - kf)).toFixed(2)})`);
        s.hs.late.forEach((el) => el.style.opacity = win(lt, 2.8, 3.3));
        s.lines.forEach((h, i) => { const k = win(lt, 0.2 + i * 0.35, 0.8 + i * 0.35); h.style.opacity = k; h.style.transform = `translateY(${(30 * (1 - k)).toFixed(1)}px)`; });
        s.cap.style.opacity = win(lt, 3.2, 3.7);
      } else if (s.type === "steps") {
        s.head.style.opacity = win(lt, 0.1, 0.6);
        s.items.forEach((d, i) => { const k = win(lt, 0.5 + i * 0.9, 1.2 + i * 0.9); d.style.opacity = k; d.style.transform = `translateY(${(36 * (1 - k)).toFixed(1)}px)`; });
      } else if (s.type === "lines" || s.type === "end") {
        if (s.courses) s.courses.forEach((c, i) => { const isNew = i === s.courses.length - 1, k = isNew ? win(lt, 0.9, 1.4) : 1; c.style.opacity = k; c.style.transform = `translateY(${(-40 * (1 - k)).toFixed(1)}px)`; });
        s.parts.forEach((p, i) => { const k = win(lt, 0.15 + i * 0.45, 0.75 + i * 0.45); p.style.opacity = k; p.style.transform = `translateY(${(28 * (1 - k)).toFixed(1)}px)`; });
        if (s.foot && s.foot.style) s.foot.style.opacity = win(lt, 0.9, 1.4);
      }
    }
  };
  window.seek(0);
  await document.fonts.ready;
  window.READY = true;
})();
</script>
</body>
</html>
