<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>First Brick reel</title>
<!-- 1080×1920 결정적 모션: window.seek(t)로 프레임을 그린다. 문구·장면은 reel.js(window.REEL = reel.json 내용)에서 읽는다. -->
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Literata:ital,opsz,wght@0,7..72,400..600;1,7..72,400&family=Noto+Sans+KR:wght@500;800&display=block" rel="stylesheet">
<style>
:root { --paper:#F4F5F0; --paper2:#E8ECE3; --ink:#16231E; --muted:#4E5C55; --blue:#22408C; --mari:#EFA52F; --b1:#A9482E; --b2:#BA5B3B; --b3:#8F3D27; --roof:#2B3A34; }
html,body { margin:0; width:1080px; height:1920px; overflow:hidden; background:var(--paper); }
#stage { position:relative; width:1080px; height:1920px; overflow:hidden; font-family:"Bricolage Grotesque","Noto Sans KR",sans-serif; color:var(--ink); }
.layer { position:absolute; inset:0; }
.brand { position:absolute; left:96px; top:150px; display:flex; align-items:center; gap:18px; font:700 40px/1 "Bricolage Grotesque"; letter-spacing:-.01em; }
.brand svg { width:62px; height:46px; }
.h { position:absolute; left:96px; right:96px; font-weight:800; letter-spacing:-.035em; line-height:.98; font-variation-settings:"opsz" 96; }
.p { position:absolute; left:96px; right:120px; font:400 44px/1.45 Literata, serif; color:var(--muted); }
.lang-ko .h { font-family:"Noto Sans KR"; letter-spacing:-.04em; line-height:1.14; }
.lang-ko .p { font-family:"Noto Sans KR"; font-weight:500; }
.step { position:absolute; left:96px; right:96px; }
.step .course { display:flex; gap:10px; margin-bottom:22px; }
.step .course i { height:34px; flex:1; border-radius:3px; }
.step h3 { margin:0 0 10px; font:800 84px/1 "Bricolage Grotesque","Noto Sans KR"; letter-spacing:-.03em; }
.step p { margin:0; font:400 40px/1.4 Literata,"Noto Sans KR",serif; color:var(--muted); max-width:820px; }
.end { position:absolute; inset:0; background:var(--blue); color:#fff; }
.end .h { color:#fff; }
.end .p { color:#DCE3F5; }
.url { position:absolute; left:96px; top:1240px; font:600 38px/1 "Bricolage Grotesque"; color:#fff; border-bottom:4px solid var(--mari); padding-bottom:10px; }
.foot { position:absolute; left:96px; right:96px; top:1340px; font:400 30px/1.3 "Bricolage Grotesque","Noto Sans KR"; color:var(--muted); }
.end .foot { color:#C9D3EE; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="reel.js"></script>
<script>
(async function () {
  const C = window.REEL || await fetch("reel.json").then(r => r.json());
  window.DUR = C.dur || 15;
  const stage = document.getElementById("stage");
  if (C.lang === "ko") stage.classList.add("lang-ko");
  const ease = (x) => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3);
  const win = (t, a, b) => ease((t - a) / (b - a));
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const logo = '<svg viewBox="0 0 30 22" style="fill:none;stroke:currentColor;stroke-width:1.3"><rect x="1" y="12" width="13" height="9" rx="1" fill="#EFA52F" stroke="#EFA52F"/><rect x="16" y="12" width="13" height="9" rx="1"/><rect x="8.5" y="1" width="13" height="9" rx="1"/></svg>';

  // 학교 입면도 (사이트 히어로와 같은 그림: 가는 선, 첫 벽돌만 금잔화색)
  function houseSVG() {
    const G = 338, bx0 = 64, bx1 = 416, by0 = 176; let k = 0; const P = [];
    const L = (d, cls) => P.push(`<path class="${cls || "ln"}" pathLength="1" data-d="${k++}" d="${d}"/>`);
    L(`M8 ${G}H472`, "ln ground"); L(`M${bx0} ${G}V${by0}H${bx1}V${G}`); L(`M44 ${by0 + 2}L240 74L436 ${by0 + 2}`); L(`M62 ${by0 - 6}L240 90L418 ${by0 - 6}`, "ln thin");
    P.push(`<circle class="ln" pathLength="1" data-d="${k++}" cx="240" cy="136" r="15"/>`); L(`M225 136H255M240 121V151`, "ln thin");
    for (const x of [98, 304]) { L(`M${x} 214h78v58h-78z`); L(`M${x + 26} 214v58M${x + 52} 214v58M${x} 243h78`, "ln thin"); L(`M${x - 6} 278h90`, "ln thin"); }
    L(`M212 ${G}V250a28 28 0 0 1 56 0V${G}`); L(`M240 222V${G}`, "ln thin"); L(`M200 ${G - 0.5}h80`, "ln thin");
    const bw = 22, bh = 9, g = 2.5, H = [];
    for (let r = 0; r < 4; r++) { const off = r % 2 ? (bw + g) / 2 : 0, n = 5 - (r === 3 ? 2 : r === 2 ? 1 : 0);
      for (let c = 0; c < n; c++) { if (!r && !c) continue; const x = bx0 + 4 + off + c * (bw + g), y = G - 4 - (r + 1) * (bh + g) + g;
        H.push(`<rect class="hatch" data-d="${r * 5 + c}" data-o="${(1 - (r * 0.18 + c * 0.13)).toFixed(2)}" x="${x}" y="${y}" width="${bw}" height="${bh}"/>`); } }
    const fx = bx0 + 4, fy = G - 4 - bh;
    const wrap = document.createElement("div");
    wrap.innerHTML = `<svg viewBox="0 0 480 400" style="width:100%;overflow:visible"><style>.ln{fill:none;stroke:#16231E;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1}.ln.thin{stroke-width:.9;stroke:#6F7B74}.ln.ground{stroke-width:1.6}.hatch{fill:none;stroke:#8E9A92;stroke-width:.9}.dim{fill:none;stroke:#A9B2AB;stroke-width:.9}.co path{fill:none;stroke:#16231E;stroke-width:1}.co text{font:italic 400 16px Literata,serif;fill:#16231E}</style>${P.join("")}${H.join("")}<rect class="first" x="${fx}" y="${fy}" width="${bw}" height="${bh}" fill="#EFA52F"/><path class="dim" d="M${bx0} ${G + 26}H${bx1}M${bx0} ${G + 20}v12M${bx1} ${G + 20}v12"/><g class="co"><path d="M${fx + bw / 2} ${fy + bh + 3}V${G + 52}H${fx + 150}"/><text x="${fx + 156}" y="${G + 56}">${C.lang === "ko" ? "첫 벽돌" : "The first brick"}</text></g></svg>`;
    const svg = wrap.firstChild;
    return { svg, lines: [...svg.querySelectorAll(".ln")], hatch: [...svg.querySelectorAll(".hatch")], first: svg.querySelector(".first"), late: [...svg.querySelectorAll(".dim, .co")] };
  }

  // 장면 만들기
  const scenes = (C.scenes || []).map((s) => {
    const L = el("div", "layer"); L.style.opacity = 0; stage.appendChild(L); s.L = L;
    if (s.type === "house") {
      const hs = houseSVG(); s.hs = hs; const wrap = el("div"); wrap.style.cssText = "position:absolute;left:70px;right:70px;top:880px;"; wrap.appendChild(hs.svg); hs.svg.style.width = "100%"; L.appendChild(wrap);
      s.lines = (s.lines || []).map((txt, i) => { const h = el("div", "h", txt); h.style.cssText += `top:${330 + i * 150}px;font-size:${s.size || 140}px;`; L.appendChild(h); return h; });
      const cap = el("div", "p", s.caption || ""); cap.style.cssText += "top:1730px;font-style:italic;font-size:38px;"; L.appendChild(cap); s.cap = cap;
    } else if (s.type === "steps") {
      const head = el("div", "h", s.title || ""); head.style.cssText += "top:240px;font-size:96px;"; L.appendChild(head); s.head = head;
      s.items = s.items.map((it, i) => { const d = el("div", "step"); d.style.top = (560 + i * 410) + "px";
        const tone = ["var(--b1)", "var(--b2)", "var(--b3)"];
        let courses = ""; for (let c = 0; c <= i; c++) courses += `<div class="course" style="margin-left:${c % 2 ? 40 : 0}px">${[0, 1, 2, 3].map((k) => `<i style="background:${i === 0 && c === 0 && k === 0 ? "var(--mari)" : tone[c]}"></i>`).join("")}</div>`;
        d.innerHTML = `<div style="display:flex;flex-direction:column-reverse">${courses}</div><h3>${it[0]}</h3><p>${it[1]}</p>`; L.appendChild(d); return d; });
    } else if (s.type === "lines") {
      const t = el("div", "h", s.title); t.style.cssText += `top:${s.top || 420}px;font-size:${s.size || 112}px;`; L.appendChild(t);
      const body = el("div", "p"); body.style.cssText += `top:${s.bodyTop || 800}px;color:var(--ink);`;
      s.parts = [t, ...(s.body || []).map((txt) => { const p = el("div", "", txt); p.style.marginBottom = "22px"; body.appendChild(p); return p; })];
      L.appendChild(body);
      if (s.wall) { const w = el("div"); w.style.cssText = "position:absolute;left:96px;right:96px;top:1260px;display:flex;flex-direction:column-reverse;gap:10px;"; const tone = ["var(--b1)", "var(--b2)", "var(--b3)", "var(--b2)", "var(--b1)"];
        s.courses = []; for (let c = 0; c < s.wall; c++) { const row = el("div"); row.style.cssText = `display:flex;gap:10px;margin-left:${c % 2 ? 46 : 0}px;margin-right:${c % 2 ? 0 : 46}px;`; row.innerHTML = [0, 1, 2, 3, 4].map((k) => `<i style="display:block;flex:1;height:44px;border-radius:3px;background:${c === 0 && k === 0 ? "var(--mari)" : tone[c % 5]}"></i>`).join(""); w.appendChild(row); s.courses.push(row); }
        L.appendChild(w); }
    } else if (s.type === "end") {
      L.classList.add("end");
      L.innerHTML = `<div class="brand" style="color:#fff">${logo}<span>First Brick</span></div>`;
      s.parts = [el("div", "h", s.title), el("div", "p", s.text || ""), el("div", "url", s.url || "")];
      s.parts[0].style.cssText += "top:520px;font-size:118px;"; s.parts[1].style.cssText += "top:900px;";
      s.parts.forEach((p) => L.appendChild(p));
      const f = el("div", "foot", s.foot || ""); L.appendChild(f); s.foot = f;
    }
    if (s.brand !== false && s.type !== "end") { const b = el("div", "brand", `${logo}<span>First Brick</span>`); L.appendChild(b); }
    if (s.note) { const f = el("div", "foot", s.note); L.appendChild(f); }
    return s;
  });

  window.seek = function (t) {
    for (const s of scenes) {
      const a = s.t0, b = s.t1, fade = 0.35;
      const vis = t >= a - 0.001 && t < b + 0.001 ? Math.min(win(t, a, a + fade), s.last ? 1 : 1 - win(t, b - fade, b)) : 0;
      s.L.style.opacity = vis;
      const lt = t - a, len = b - a;
      if (s.type === "house") {
        s.hs.lines.forEach((el) => { const d = +el.dataset.d, k = win(lt, 0.1 + d * 0.07, 1.1 + d * 0.07); el.style.strokeDashoffset = (1 - k).toFixed(3); });
        s.hs.hatch.forEach((el) => { const d = +el.dataset.d; el.style.opacity = (+el.dataset.o * win(lt, 1.6 + d * 0.03, 2.0 + d * 0.03)).toFixed(3); });
        const kf = win(lt, 2.3, 2.8); s.hs.first.style.opacity = kf; s.hs.first.setAttribute("transform", `translate(0 ${(-18 * (1 - kf)).toFixed(2)})`);
        s.hs.late.forEach((el) => el.style.opacity = win(lt, 2.8, 3.3));
        s.lines.forEach((h, i) => { const k = win(lt, 0.2 + i * 0.35, 0.8 + i * 0.35); h.style.opacity = k; h.style.transform = `translateY(${(30 * (1 - k)).toFixed(1)}px)`; });
        s.cap.style.opacity = win(lt, 3.2, 3.7);
      } else if (s.type === "steps") {
        s.head.style.opacity = win(lt, 0.1, 0.6);
        s.items.forEach((d, i) => { const k = win(lt, 0.5 + i * 0.9, 1.2 + i * 0.9); d.style.opacity = k; d.style.transform = `translateY(${(36 * (1 - k)).toFixed(1)}px)`; });
      } else if (s.type === "lines" || s.type === "end") {
        if (s.courses) s.courses.forEach((c, i) => { const isNew = i === s.courses.length - 1, k = isNew ? win(lt, 0.9, 1.4) : 1; c.style.opacity = k; c.style.transform = `translateY(${(-40 * (1 - k)).toFixed(1)}px)`; });
        s.parts.forEach((p, i) => { const k = win(lt, 0.15 + i * 0.45, 0.75 + i * 0.45); p.style.opacity = k; p.style.transform = `translateY(${(28 * (1 - k)).toFixed(1)}px)`; });
        if (s.foot && s.foot.style) s.foot.style.opacity = win(lt, 0.9, 1.4);
      }
    }
  };
  window.seek(0);
  await document.fonts.ready;
  window.READY = true;
})();
</script>
</body>
</html>
